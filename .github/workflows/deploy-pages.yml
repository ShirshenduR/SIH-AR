name: Deploy webapp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the web app as the site root, so the URL is clean:
          # https://<user>.github.io/SIH-AR/  →  index.html, ar.html, ...
          path: demo/webapp
      - id: deployment
        uses: actions/deploy-pages@v4
